version: 2

models:
  - name: gld_dim_product
    description: >
      Dimensión de productos de AdventureWorks (Type 1: se sobrescribe, sin
      historia). Grano: una fila por producto. Incluye 2 filas por defecto
      (-1 Missing y -2 Not Applicable), añadidas por upsert_default_rows en el
      post_hook, para que los hechos con producto desconocido sigan uniéndose.
      Los productos sin subcategoría (componentes) traen nulos en
      category_name, subcategory_name y model_name.

    columns:
      - name: product_key
        description: >
          Surrogate key del producto, generada en Gold a partir de product_id.
          En las filas por defecto toma el valor de texto Missing /
          Not Applicable.
        data_tests:
          - unique
          - not_null

      - name: product_id
        description: >
          Clave natural del producto en AdventureWorks. Es -1 y -2 en las
          filas por defecto.
        data_tests:
          - unique
          - not_null

      - name: product_name
        description: Nombre del producto.

      - name: product_number
        description: Número de producto.

      - name: category_name
        description: Nombre de la categoría del producto.

      - name: subcategory_name
        description: Nombre de la subcategoría del producto.

      - name: model_name
        description: Nombre del modelo del producto.

      - name: make_flag
        description: Indica si el producto se fabrica internamente.

      - name: finished_goods_flag
        description: Indica si el producto es un bien terminado.

      - name: reorder_point
        description: Nivel de inventario que dispara una nueva orden de compra.

      - name: product_modified_date
        description: >
          Fecha de última modificación del producto en el origen. Columna de
          auditoría; podría eliminarse más adelante.
