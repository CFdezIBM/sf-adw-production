version: 2

models:
  - name: slv_adventure_works_production__work_order
    description: >
      Órdenes de trabajo de fabricación de AdventureWorks, con las cantidades
      producidas y desechadas y las fechas del ciclo de fabricación.
      Grano: una fila por orden de trabajo.

    columns:
      - name: work_order_id
        description: >
          Identificador único de la orden de trabajo.
        data_tests:
          - unique
          - not_null

      - name: product_id
        description: >
          Producto que se fabrica en la orden.

      - name: order_qty
        description: >
          Unidades a fabricar en la orden.

      - name: stocked_qty
        description: >
          Cantidad efectivamente ingresada al inventario.

      - name: scrapped_qty
        description: >
          Cantidad desechada por defectos.

      - name: start_date
        description: >
          Fecha de inicio de la fabricación.

      - name: end_date
        description: >
          Fecha de fin de la fabricación. Nula mientras la orden sigue abierta.

      - name: due_date
        description: >
          Fecha comprometida de entrega.

      - name: scrap_reason_id
        description: >
          Identificador del motivo de desecho. Nulo cuando no se desechó nada.

      - name: modified_date
        description: >
          Fecha y hora de la última modificación registrada para el registro.
