version: 2

models:
  - name: slv_adventure_works_production__illustration
    description: >
      Silver layer model for the Illustration entity. Stores the XML diagrams
      used to describe bicycle assembly instructions in the AdventureWorks
      Production domain. The grain is one row per illustration.

    columns:

      - name: illustration_id
        description: "Primary key. Unique identifier for each illustration."
        tests:
          - not_null
          - unique

      - name: diagram
        description: "XML content containing the illustration or assembly diagram."

      - name: modified_date
        description: "Timestamp of the last modification of the record."
        tests:
          - not_null

