version: 2

models:
  - name: slv_adventure_works_production__product_review
    description: >
      Silver layer model for the Product Review entity. Stores customer reviews
      submitted for products in the AdventureWorks Production domain.
      The grain is one row per product review.

    columns:

      - name: product_review_id
        description: "Primary key. Unique identifier for each product review."
        tests:
          - not_null
          - unique

      - name: product_id
        description: "Foreign key to the Product entity. Identifies the product being reviewed."
        tests:
          - not_null

      - name: reviewer_name
        description: "Name of the customer who submitted the review."
        tests:
          - not_null

      - name: review_date
        description: "Date and time when the review was submitted. Maintained as TIMESTAMP_NTZ from Bronze."
        tests:
          - not_null

      - name: email_address
        description: "Email address of the reviewer."
        tests:
          - not_null

      - name: rating
        description: "Numeric rating given by the reviewer. Maintained as integer from Bronze."
        tests:
          - not_null

      - name: comments
        description: "Optional free-text comments provided by the reviewer."

      - name: modified_date
        description: "Timestamp of the last modification of the record. Maintained as TIMESTAMP_NTZ from Bronze."
        tests:
          - not_null
          